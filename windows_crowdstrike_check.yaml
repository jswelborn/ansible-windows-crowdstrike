---
- name: Check and remediate Windows CrowdStrike Falcon service
  hosts: all
  gather_facts: false

  vars:
    service_name: CSFalconService

  tasks:
    - name: Gather CrowdStrike Falcon service info
      ansible.windows.win_service_info:
        name: "{{ service_name }}"
      register: crowdstrike_service_info
      ignore_unreachable: true
      failed_when: false

    - name: End compliance check when service information could not be gathered
      ansible.builtin.meta: end_host
      when:
        - crowdstrike_service_info.unreachable | default(false) or
          crowdstrike_service_info.failed | default(false)

    - name: Fail if CrowdStrike Falcon service is missing
      ansible.builtin.fail:
        msg: "CrowdStrike Falcon service is missing"
      when:
        - not crowdstrike_service_info.exists | default(false)

    - name: Start CrowdStrike Falcon service when it is stopped
      ansible.windows.win_service:
        name: "{{ service_name }}"
        state: started
        start_mode: auto
      when:
        - crowdstrike_service_info.exists
        - crowdstrike_service_info.services[0].state != "started"

    - name: Refresh CrowdStrike Falcon service info after remediation
      ansible.windows.win_service_info:
        name: "{{ service_name }}"
      register: crowdstrike_remediation_info
      ignore_unreachable: true
      failed_when: false

    - name: End compliance check when service information could not be refreshed
      ansible.builtin.meta: end_host
      when:
        - crowdstrike_remediation_info.unreachable | default(false) or
          crowdstrike_remediation_info.failed | default(false)

    - name: Fail if CrowdStrike Falcon service is still not running
      ansible.builtin.fail:
        msg: "CrowdStrike Falcon service exists but could not be started"
      when:
        - crowdstrike_remediation_info.exists | default(false)
        - crowdstrike_remediation_info.services[0].state != "started"